apis:
  - aid: wework:partner-api
    name: WeWork Partner API
    description: The WeWork Partner API exposes the company's global workspace inventory to integrators so that Supply Partners (third-party operators contributing spaces to WeWork) and Demand Partners (resellers and platforms booking WeWork inventory on behalf of end users) can build workspace booking into their own apps and websites. Documented capability domains include Identity (user lookup), Locations, Inventory, Availability and Calendaring, Booking, and Keycard Access. Authentication uses service tokens, and access requires partner application and review. The full API reference is gated behind Auth0 sign-in and is not publicly browsable, so endpoint paths, request/response schemas, and quota policies cannot be catalogued from public sources.
    humanURL: https://developers.wework.com
    tags:
      - Partner API
      - Bookings
      - Inventory
      - Locations
      - Availability
      - Calendaring
      - Identity
      - Keycard Access
