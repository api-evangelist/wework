  - aid: wework:workplace
    name: WeWork Workplace
    description: WeWork Workplace is the company's SaaS workplace-management platform sold to enterprises and landlords to manage flexible-office space across owned, leased, and partner locations. The product is referenced on wework.com but its dedicated marketing site at workplace.wework.com was unreachable (HTTP 403) and no public API documentation, OpenAPI spec, or integration surface for Workplace could be located. It is included here for completeness; the public Partner API above appears to be the only documented programmatic surface.
    humanURL: https://www.wework.com
